<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>PalGenoPedia Volunteer Portal</title>
<link rel="stylesheet" href="assets/style.css">
<script src="config.js"></script>
</head>
<body>
<header class="topbar">
  <button id="brand-home" class="brand link-btn">PalGenoPedia Volunteer Portal</button>
  <button id="admin-link" class="link-btn" hidden>Activity log</button>
  <span id="whoami" class="muted"></span>
  <button id="signout" class="link-btn">Sign out</button>
</header>

<main id="app" class="app-shell">
  <p class="muted">Loading…</p>
</main>

<template id="tpl-home">
  <section>
    <h2>PalGenoPedia Volunteer Portal</h2>
    <p class="muted small">Choose an area.</p>
    <div class="grid" data-role="home-cats"></div>
  </section>
</template>

<template id="tpl-sections">
  <section>
    <button class="back-btn" data-role="back-to-home">&larr; Home</button>
    <h2>War Crimes — choose a section</h2>
    <div class="grid" data-role="sections"></div>
  </section>
</template>

<template id="tpl-historical">
  <section>
    <button class="back-btn" data-role="back-to-home">&larr; Home</button>
    <h2>Historical War Crimes</h2>
    <p class="muted small">
      Massacres and mass-atrocity events. The list shows both the historical
      (1948→2022) and ongoing (Oct 2023→) sets — new submissions go to the
      ongoing set. Submit the event and one source; a reviewer builds out the
      detailed timeline, testimony and legal findings in the sheet afterwards.
    </p>

    <div class="two-col">
      <div>
        <h3>Recorded events <span class="muted" data-role="hist-count"></span></h3>
        <p class="muted small">Check this list before submitting — this is the duplicate check.</p>
        <div class="list" data-role="hist-list"></div>
      </div>

      <div>
        <h3>Document a new event</h3>
        <form data-role="hist-form"></form>
        <p class="error" data-role="hist-error" hidden></p>
        <p class="success" data-role="hist-success" hidden>Submitted. A reviewer will verify it in the sheet.</p>
      </div>
    </div>
  </section>
</template>

<template id="tpl-archiving-home">
  <section>
    <button class="back-btn" data-role="back-to-home">&larr; Home</button>
    <h2>Archiving Portal</h2>
    <p class="muted small">
      Curate which source domains get preserved, and how. Editors only.
    </p>
    <div class="grid">
      <button class="section-card" data-role="go-resources">
        <strong>Resources</strong>
        <span class="muted small">Article / report sources — source_url_1 (primary) and source_url_2 (secondary).</span>
      </button>
      <button class="section-card" data-role="go-media">
        <strong>Media</strong>
        <span class="muted small">video_url and image_url — separate policy, usually Manual / ArchiveBox.</span>
      </button>
    </div>
  </section>
</template>

<template id="tpl-facilities">
  <section>
    <button class="back-btn" data-role="back-to-sections">&larr; Sections</button>
    <h2 data-role="section-title"></h2>
    <input type="search" data-role="facility-filter" placeholder="Filter facilities…">
    <div class="list" data-role="facility-list"></div>
  </section>
</template>

<template id="tpl-facility-detail">
  <section>
    <button class="back-btn" data-role="back-to-facilities">&larr; Facilities</button>
    <h2 data-role="facility-title"></h2>

    <div class="two-col">
      <div>
        <h3>Existing incidents <span class="muted" data-role="incident-count"></span></h3>
        <p class="muted small">Check this list before submitting — this is the duplicate check.</p>
        <div class="list" data-role="incident-list"></div>
      </div>

      <div>
        <h3>Document a new incident</h3>
        <form data-role="incident-form">
          <label>Date <span class="req">*</span>
            <input type="date" name="starting_date" required>
          </label>
          <p class="warning" data-role="dup-warning" hidden></p>

          <label>End date (if the incident spans multiple days)
            <input type="date" name="ending_date">
          </label>

          <label>Attack type <span class="req">*</span>
            <select name="attack_type" required>
              <option value="">Select…</option>
              <option>Airstrike</option>
              <option>Shelling</option>
              <option>Siege / access denial</option>
              <option>Raid / incursion</option>
              <option>Sniper fire</option>
              <option>Detention of staff or patients</option>
              <option>Other</option>
            </select>
          </label>

          <label>Summary / full account
            <textarea name="description" rows="5"></textarea>
          </label>

          <label>Source URL <span class="req">*</span>
            <input type="url" name="source_url_1" required placeholder="https://…">
          </label>
          <label>Additional source URL
            <input type="url" name="source_url_2" placeholder="https://…">
          </label>

          <label>Image URL
            <input type="url" name="image_url" placeholder="https://…">
          </label>
          <label>Video URL
            <input type="url" name="video_url" placeholder="https://…">
          </label>

          <div class="two-col">
            <label>Civilians killed
              <input type="number" name="civilians_killed" min="0" step="1">
            </label>
            <label>Civilians injured
              <input type="number" name="civilians_injured" min="0" step="1">
            </label>
          </div>

          <button type="submit">Submit incident</button>
          <p class="error" data-role="submit-error" hidden></p>
          <p class="success" data-role="submit-success" hidden>Submitted. A reviewer will verify it in the sheet.</p>
        </form>
      </div>
    </div>
  </section>
</template>

<template id="tpl-archive-policy">
  <section>
    <button class="back-btn" data-role="back-to-archiving">&larr; Archiving Portal</button>
    <h2>Resources archiving</h2>
    <p class="muted small">
      One row per source domain, most-cited first. Set a <strong>priority</strong>
      (High / Normal / Skip) and an <strong>archiving method</strong> per domain.
      The weekly archiver only touches domains set to High or Normal with method
      <em>Wayback Machine</em>; other methods are recorded for the ArchiveBox layer,
      Skip and unset are left alone. Changes commit straight to the main site repo.
    </p>
    <div class="policy-legend small">
      <p><strong>Which method suits which source:</strong></p>
      <ul>
        <li><strong>Social / video</strong> — x, Facebook, Instagram, Telegram, YouTube:
          use <em>archive.today</em>. Wayback just captures a login wall for these.</li>
        <li><strong>UN &amp; intergovernmental</strong> — un.org, UNRWA, OHCHR, WHO, ICRC,
          ReliefWeb: <em>Wayback Machine</em>, and worth <strong>High</strong> priority.</li>
        <li><strong>Rights &amp; humanitarian</strong> — HRW, Amnesty, B'Tselem, Al Mezan,
          PCHR, MSF: <em>Wayback Machine</em>, <strong>High</strong> priority. Report PDFs
          may want ArchiveBox later.</li>
        <li><strong>Government / military</strong> — idf.il, mfa.gov.il, *.gov.ps, *.gov.il:
          <em>Wayback Machine</em> — snapshot before statements are edited or removed.</li>
        <li><strong>Academic / reference</strong> — *.edu, JSTOR, palestine-studies.org,
          Wikipedia: <em>Wayback Machine</em>; ArchiveBox later for datasets and PDFs.</li>
        <li><strong>News &amp; other</strong> — <em>Wayback Machine</em> handles most;
          a few paywalled outlets may need archive.today.</li>
      </ul>
      <p>The Method dropdown below is pre-set to the recommendation for each domain — change it if you disagree.</p>
    </div>
    <input type="search" data-role="policy-filter" placeholder="Filter domains…">
    <p class="error" data-role="policy-error" hidden></p>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Domain</th><th>URLs</th><th>Archived</th>
            <th>Priority</th><th>Method</th><th></th>
          </tr>
        </thead>
        <tbody data-role="policy-body"></tbody>
      </table>
    </div>
  </section>
</template>

<template id="tpl-media-policy">
  <section>
    <button class="back-btn" data-role="back-to-archiving">&larr; Archiving Portal</button>
    <h2>Media archiving</h2>
    <p class="muted small">
      One row per domain that hosts a <code>video_url</code> or
      <code>image_url</code>, most-cited first. Set a <strong>priority</strong>
      and an <strong>archiving method</strong> per domain — separate from the
      article-source policy. Changes commit straight to the main site repo.
    </p>
    <div class="policy-legend small">
      <p><strong>Media needs a different approach:</strong></p>
      <ul>
        <li><strong>Video</strong> (YouTube, X, Facebook, Telegram, Instagram) —
          the Wayback Machine can't reliably capture video. Leave as
          <em>Manual</em> for now; these are logged in
          <code>archive-deferred.txt</code> for the planned ArchiveBox +
          yt-dlp job. Pick <em>archive.today</em> if someone will do it by hand.</li>
        <li><strong>Direct image URLs</strong> (agency photo CDNs, WAFA / UNRWA
          image hosts) — <em>Wayback Machine</em> often works for a plain
          <code>.jpg</code>/<code>.png</code>. Try it; fall back to Manual.</li>
        <li><strong>Licensed wire photos</strong> (Getty, Reuters Connect,
          guim.co.uk, wsj.net) — <em>Manual</em>; these usually 403 or watermark.</li>
      </ul>
      <p>Unset domains default to <em>Manual</em>. The weekly archiver only
        auto-captures a domain set to High/Normal + Wayback.</p>
    </div>
    <input type="search" data-role="policy-filter" placeholder="Filter domains…">
    <p class="error" data-role="policy-error" hidden></p>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Domain</th><th>URLs</th><th>Archived</th>
            <th>Priority</th><th>Method</th><th></th>
          </tr>
        </thead>
        <tbody data-role="policy-body"></tbody>
      </table>
    </div>
  </section>
</template>

<template id="tpl-admin-log">
  <section>
    <button class="back-btn" data-role="back-to-home">&larr; Home</button>
    <h2>Activity log</h2>
    <p class="muted small">Most recent 200 submissions and edits, newest first.</p>
    <div class="table-wrap">
      <table data-role="log-table">
        <thead>
          <tr><th>Time</th><th>Volunteer</th><th>Action</th><th>Section</th><th>Facility</th><th>Reference</th></tr>
        </thead>
        <tbody data-role="log-body"></tbody>
      </table>
    </div>
  </section>
</template>

<script src="assets/app.js"></script>
</body>
</html>
